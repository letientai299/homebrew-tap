name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Homebrew (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      HOMEBREW_NO_AUTO_UPDATE: '1'
      HOMEBREW_NO_INSTALL_CLEANUP: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: Homebrew/actions/setup-homebrew@4790763c0a3ba4036f72634dc079c4a7dfcd4878
      - name: Tap checkout
        run: brew tap --custom-remote letientai299/tap "$GITHUB_WORKSPACE"
      - name: Check formula style
        run: brew style letientai299/tap/vpdf
      - name: Install vpdf
        run: brew install letientai299/tap/vpdf
      - name: Audit vpdf
        run: brew audit --strict --installed letientai299/tap/vpdf
      - name: Test vpdf
        run: brew test letientai299/tap/vpdf
